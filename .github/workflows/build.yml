name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 17 is the lowest Java the server supports; 21 is current LTS
        java: [17, 21]
    name: ${{ matrix.os }}, Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test inside Equinox and export the runnable jar
        run: ./gradlew --console=plain check :server:export
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && matrix.java == 17
        with:
          name: mat-calcite-mcp
          path: server/build/distributions/executable/mat-calcite-mcp.jar
