name: Release

# Push a tag v<version>, matching Bundle-Version in server/bnd.bnd, to build, test and publish:
# - a GitHub release with mat-calcite-mcp-<version>.jar and its SHA-256
# - the container image ghcr.io/<owner>/mat-calcite-mcp:<version> and :latest, for amd64 and arm64
on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the release
  packages: write  # push the image

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the bundle version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^Bundle-Version: ${version}\." server/bnd.bnd; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Bundle-Version in server/bnd.bnd"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build, test inside Equinox and export the runnable jar
        run: ./gradlew --console=plain check :server:export

      - name: Release files
        run: |
          mkdir dist
          cp server/build/distributions/executable/mat-calcite-mcp.jar "dist/mat-calcite-mcp-$VERSION.jar"
          cd dist && sha256sum "mat-calcite-mcp-$VERSION.jar" > "mat-calcite-mcp-$VERSION.jar.sha256"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test the published image as an MCP server
        run: |
          # Locked down, as the README recommends: no network (the server needs none), a read-only filesystem, no
          # capabilities, and an arbitrary non-root user (--user), for which the dumps folder must be writable.
          # If the server ever needed one of these, this step fails and the release does not go out.
          mkdir -p smoke && cp server/dumps/mvn1m_jdk18.hprof smoke/ && chmod 777 smoke
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke"}}}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"open_heap_dump","arguments":{"path":"/dumps/mvn1m_jdk18.hprof"}}}'
            echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"sql_query","arguments":{"sql":"select count(*) c from java.lang.String"}}}'
          } | docker run -i --rm \
              --network none \
              --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m \
              --cap-drop ALL --security-opt no-new-privileges \
              --pids-limit 256 --memory 2g \
              --user 12345:12345 -v "$PWD/smoke:/dumps" "$IMAGE:$VERSION" > out.jsonl
          cat out.jsonl
          # The image runs as a non-root user by default, without --user
          test "$(docker run --rm --entrypoint id "$IMAGE:$VERSION" -u)" != 0
          test "$(wc -l < out.jsonl)" -eq 3
          grep -q "\"version\":\"$VERSION\." out.jsonl
          grep -q 'objects: 15540' out.jsonl
          grep -q '| 3256 |' out.jsonl

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release notes are this version's section of CHANGELOG.md
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\nContainer image: `%s:%s` (amd64, arm64)\n' "$IMAGE" "$VERSION" >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "mat-calcite-mcp $VERSION" --notes-file notes.md
